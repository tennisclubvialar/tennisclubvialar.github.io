name: Dominio e HTTPS
on:
  push:
    paths: ['.github/workflows/dominio.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  pages: write
  contents: read
jobs:
  dominio:
    runs-on: ubuntu-latest
    steps:
      - name: Stato attuale
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh api repos/${{ github.repository }}/pages
      - name: Imposta dominio
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh api -X PUT repos/${{ github.repository }}/pages -f cname=www.devialar.com || true
      - name: Controllo DNS
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh api repos/${{ github.repository }}/pages/health || true
      - name: Attiva HTTPS obbligatorio
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh api -X PUT repos/${{ github.repository }}/pages -F https_enforced=true && echo "HTTPS ATTIVO" || echo "Certificato non ancora pronto, riprovo tra un'ora"
          gh api repos/${{ github.repository }}/pages
